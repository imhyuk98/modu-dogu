name: Update Fuel Prices

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-fuel-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Fetch verified Opinet data
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: node scripts/update-fuel-prices.mjs

      - name: Open or update verified data pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fuel-prices.json public/fuel-stations/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update fuel prices $(date +%F)"
          branch="automation/fuel-data"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease="refs/heads/$branch" origin "HEAD:refs/heads/$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --base master --head "$branch" --title "chore: update fuel prices" --body "Automated Opinet data update. Merge only after the Quality workflow passes."
          gh workflow run quality.yml --ref "$branch"
          gh pr merge "$branch" --auto --squash
