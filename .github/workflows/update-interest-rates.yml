name: Update Interest Rates

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-interest-rates
  cancel-in-progress: false

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch verified Bank of Korea rates
        env:
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
        run: node scripts/update-interest-rates.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/interest-rates.json
          git diff --staged --quiet || git commit -m "chore: update interest rates $(date +%F)"
          git push
